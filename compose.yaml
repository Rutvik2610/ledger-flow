services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU22-ubuntu-22.04
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Run scripts/dev-init.sh first}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  redis:
    image: redis:7.4.7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    environment: &app-environment
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Development: "true"
      ConnectionStrings__Sql: Server=sql;Database=LedgerFlow;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Redis: redis:6379
      Transport: Local
    command: ["--migrate"]
    depends_on:
      sql: {condition: service_healthy}
  api:
    build: .
    environment: *app-environment
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  sql-data:
